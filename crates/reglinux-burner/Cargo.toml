[package]
name = "reglinux-burner"
version = "0.1.0"
edition.workspace = true
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reglinux-fetch = { path = "../reglinux-fetch" }
usbimager-sys = { path = "../usbimager-sys" }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.6"
